<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作时间统计</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div class="background-decoration"></div>
    <div class="background-decoration"></div>

    <div class="container">
        <div class="date-display">
            <span id="current-date"></span>
        </div>
        <h1>工作时间统计</h1>
        
        <!-- 历史数据提示 -->
        <div id="history-alert" class="history-alert hidden">
            <span class="close-btn" onclick="closeHistoryAlert()">×</span>
            <div id="history-content"></div>
        </div>
        
        <!-- 工作按钮 -->
        <div class="button-group">
            <div class="status-header">
                <h2>工作状态</h2>
                <div class="real-time-counter" id="real-time-counter">
                    <span id="counter-hours">00</span>:<span id="counter-minutes">00</span>:<span id="counter-seconds">00</span>
                </div>
            </div>
            <div class="fish-buttons">
                <div class="fish-btn-pair">
                    <button id="start-work" class="action-btn work-btn" onclick="startWork()">
                        <span class="material-icons btn-icon">work</span>上班
                    </button>
                    <button id="end-work" class="action-btn work-btn" disabled onclick="endWork()">
                        <span class="material-icons btn-icon">home</span>下班
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 摸鱼按钮 -->
        <div class="button-group">
            <div class="status-header">
                <h2>休息状态</h2>
                <div class="real-time-counter fish-counter" id="fish-real-time-counter">
                    <span id="fish-counter-hours">00</span>:<span id="fish-counter-minutes">00</span>:<span id="fish-counter-seconds">00</span>
                </div>
            </div>
            <div class="fish-buttons">
                <div class="fish-btn-pair">
                    <button id="start-walk" class="action-btn fish-btn" onclick="startWalk()">
                        <span class="material-icons btn-icon">directions_walk</span>出发遛弯
                    </button>
                    <button id="end-walk" class="action-btn fish-btn" disabled onclick="endWalk()">
                        <span class="material-icons btn-icon">check</span>结束遛弯
                    </button>
                </div>
                <div class="fish-btn-pair">
                    <button id="start-lunch" class="action-btn fish-btn" onclick="startLunch()">
                        <span class="material-icons btn-icon">restaurant</span>出发吃饭
                    </button>
                    <button id="end-lunch" class="action-btn fish-btn" disabled onclick="endLunch()">
                        <span class="material-icons btn-icon">check</span>结束吃饭
                    </button>
                </div>
                <div class="fish-btn-pair">
                    <button id="start-wc" class="action-btn fish-btn" onclick="startWC()">
                        <span class="material-icons btn-icon">wc</span>上洗手间
                    </button>
                    <button id="end-wc" class="action-btn fish-btn" disabled onclick="endWC()">
                        <span class="material-icons btn-icon">check</span>离开洗手间
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 今日统计 -->
        <div class="stats-container">
            <h2>今日统计</h2>
            <div class="stats-box">
                <div class="stat-item">
                    <span class="stat-label">
                        <span class="material-icons btn-icon">schedule</span>
                        工作时间：
                    </span>
                    <span id="work-time" class="stat-value">0小时0分钟0秒</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">
                        <span class="material-icons btn-icon">beach_access</span>
                        摸鱼时间：
                    </span>
                    <span id="fish-time" class="stat-value">0小时0分钟0秒</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">
                        <span class="material-icons btn-icon">pie_chart</span>
                        摸鱼比例：
                    </span>
                    <span id="fish-ratio" class="stat-value">0%</span>
                </div>
            </div>
            <button id="view-stats" class="stats-btn">
                <span class="material-icons btn-icon">assessment</span>查看统计报表
            </button>
        </div>
    </div>
    
    <!-- 统计报表弹窗 -->
    <div id="stats-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeStatsModal()">×</span>
            <h2>时间统计报表</h2>
            
            <div class="tab-container">
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('week')">周统计</button>
                    <button class="tab-btn" onclick="switchTab('month')">月统计</button>
                </div>
                
                <div id="week-tab" class="tab-content active">
                    <div class="chart-container">
                        <canvas id="week-chart"></canvas>
                    </div>
                    <div class="table-container">
                        <table id="week-table">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>工作时间</th>
                                    <th>摸鱼时间</th>
                                    <th>摸鱼比例</th>
                                </tr>
                            </thead>
                            <tbody id="week-table-body"></tbody>
                        </table>
                    </div>
                </div>
                
                <div id="month-tab" class="tab-content">
                    <div class="chart-container">
                        <canvas id="month-chart"></canvas>
                    </div>
                    <div class="table-container">
                        <table id="month-table">
                            <thead>
                                <tr>
                                    <th>周次</th>
                                    <th>工作时间</th>
                                    <th>摸鱼时间</th>
                                    <th>摸鱼比例</th>
                                </tr>
                            </thead>
                            <tbody id="month-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="storage.js"></script>
    <script src="statistics.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </body>
</html>
